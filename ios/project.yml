# Fahrgast-Info für das iPhone — Projektbeschreibung für XcodeGen (`xcodegen generate` erzeugt daraus das Xcode-Projekt).
# Das Xcode-Projekt selbst liegt nicht im Repository; so bleibt nur diese eine, lesbare Datei zu pflegen.
name: FahrgastInfo
options:
  bundleIdPrefix: de.kaibsb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Wohin die App spricht. Vorgabe: die Testumgebung von KAI.
    KAI_BASIS: "https://kai-bsb.de/test"
targets:
  FahrgastInfo:
    type: application
    platform: iOS
    sources: [FahrgastInfo]
    info:
      path: FahrgastInfo/Info.plist
      properties:
        CFBundleDisplayName: Fahrgast-Info
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KAIBasis: "$(KAI_BASIS)"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kaibsb.fahrgastinfo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  FahrgastInfoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FahrgastInfoTests]
    dependencies:
      - target: FahrgastInfo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FahrgastInfo:
    build:
      targets:
        FahrgastInfo: all
        FahrgastInfoTests: [test]
    test:
      config: Debug
      targets: [FahrgastInfoTests]
